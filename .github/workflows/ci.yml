name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # No bloquea el merge todavia (ver ENG-SRC-003 del audit-kit): antes esto solo se
      # detectaba con una auditoria manual. continue-on-error hasta definir el umbral que
      # deba frenar un PR.
      - run: npm audit --audit-level=high
        continue-on-error: true
