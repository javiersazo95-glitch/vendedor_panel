name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA y no por etiqueta (SEC-MARKET-E08): quien publica una accion puede
      # reapuntar una etiqueta, y entonces cambia lo que corre en CI sin que cambie este
      # archivo. El SHA no se puede reapuntar. La version va al lado para saber que se actualiza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # No bloquea el merge todavia (ver ENG-SRC-003 del audit-kit): antes esto solo se
      # detectaba con una auditoria manual. continue-on-error hasta definir el umbral que
      # deba frenar un PR.
      - run: npm audit --audit-level=high
        continue-on-error: true
